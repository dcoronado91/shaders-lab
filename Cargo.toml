[package]
name = "shaders_lab"
version = "0.1.0"
edition = "2024"

[dependencies]
raylib = { version = "6.0.0", features = ["SUPPORT_IMAGE_GENERATION"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

# raylib-sys picks its CMake configuration from the build script's own
# debug assertions; building it as Release links the same C runtime as Rust
# (avoids the LNK4098 MSVCRTD warning in debug builds and tests).
[profile.dev.build-override]
debug-assertions = false
